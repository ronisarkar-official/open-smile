<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full background fill extending to edges for maskable requirement -->
  <rect width="512" height="512" fill="#FF2D78" />
  
  <!-- Safe Zone Neubrutalist Face Graphic -->
  <g transform="translate(0, 0)">
    <!-- Eyes inside safe zone (within 410px circle) -->
    <circle cx="180" cy="210" r="30" fill="#000000" />
    <circle cx="332" cy="210" r="30" fill="#000000" />
    
    <!-- Big Joyful Smile Arc -->
    <path d="M 150 290 C 195 385, 317 385, 362 290" fill="none" stroke="#000000" stroke-width="32" stroke-linecap="square" />
    
    <!-- Mini accent cheek dots -->
    <rect x="110" y="270" width="24" height="24" fill="#FFD23F" stroke="#000000" stroke-width="8" />
    <rect x="378" y="270" width="24" height="24" fill="#FFD23F" stroke="#000000" stroke-width="8" />
  </g>
</svg>