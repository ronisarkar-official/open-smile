<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#faf8f5" />
  
  <!-- Hard Shadow behind the card -->
  <rect x="76" y="76" width="380" height="380" rx="0" fill="#000000" />
  
  <!-- Main Neubrutalist Card -->
  <rect x="56" y="56" width="380" height="380" rx="0" fill="#FF2D78" stroke="#000000" stroke-width="24" />
  
  <!-- Left Eye -->
  <circle cx="170" cy="200" r="28" fill="#000000" />
  
  <!-- Right Eye (Playful wink or wide circle) -->
  <circle cx="322" cy="200" r="28" fill="#000000" />
  
  <!-- Smile Mouth Arc -->
  <path d="M 140 280 C 180 370, 312 370, 352 280" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="square" />
  
  <!-- Small Coin / Star Accent on corner -->
  <rect x="360" y="32" width="64" height="64" fill="#FFD23F" stroke="#000000" stroke-width="12" />
  <circle cx="392" cy="64" r="12" fill="#000000" />
</svg>